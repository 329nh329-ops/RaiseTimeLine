services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: raisetimeline
      POSTGRES_USER: raisetimeline
      POSTGRES_PASSWORD: raisetimeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raisetimeline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
