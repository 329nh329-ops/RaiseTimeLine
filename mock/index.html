<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - RaiseTimeLine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <h1>RaiseTimeLine</h1>
    <div id="login-success" class="success-message" hidden>登録が完了しました。ログインしてください。</div>
    <div id="login-error" class="error-message" hidden></div>
    <form id="login-form">
      <div class="form-field">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">パスワード</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">ログイン</button>
    </form>
    <p class="auth-switch">
      アカウントをお持ちでない方は <a href="signup.html">こちら</a>
    </p>
    <p class="auth-switch">テスト用: akane@example.com / password</p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  handleLoginForm();
  if (new URLSearchParams(location.search).get("registered") === "1") {
    document.getElementById("login-success").hidden = false;
  }
</script>
</body>
</html>
