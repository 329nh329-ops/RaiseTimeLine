<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フォロー一覧 - RaiseTimeLine</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <a id="back-link" href="profile.html" class="icon-button" title="戻る">←</a>
  <span class="logo" id="page-title">フォロー中</span>
  <div class="header-actions">
    <a href="search.html" class="icon-button" title="検索">🔍</a>
    <a id="header-my-icon" href="profile.html">
      <img class="avatar" src="" alt="自分のアイコン">
    </a>
    <button id="logout-button" class="btn-danger-text">ログアウト</button>
  </div>
</header>

<div class="page-container">
  <div class="tabs">
    <button class="tab" data-type="following">フォロー中</button>
    <button class="tab" data-type="followers">フォロワー</button>
  </div>
  <div id="user-list"></div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/follow-list.js"></script>
</body>
</html>
